services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kikuubo_dev
      MYSQL_USER: kikuubo_app
      MYSQL_PASSWORD: ${KIKUUBO_DB_PASSWORD:?Database password required}
      MYSQL_ROOT_PASSWORD: ${KIKUUBO_DB_ROOT_PASSWORD:?Root password required}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - kikuubo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  kikuubo_mysql_data:
